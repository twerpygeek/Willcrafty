<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WillCrafty Onboarding HyperFrames Composition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f7fffd;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      [data-composition-id="willcrafty-onboarding"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 88% 12%, rgba(10, 186, 181, 0.3), transparent 520px),
          linear-gradient(135deg, #ffffff 0%, #eefbf9 56%, #d9fbf8 100%);
        color: #102126;
      }

      .brand {
        position: absolute;
        top: 70px;
        left: 80px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 34px;
        font-weight: 900;
      }

      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border-radius: 18px;
        background: #0abab5;
        color: white;
        box-shadow: 0 28px 70px rgba(10, 186, 181, 0.28);
      }

      .mark svg {
        width: 46px;
        height: 46px;
        fill: none;
        stroke: currentColor;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .headline {
        position: absolute;
        top: 248px;
        left: 90px;
        width: 720px;
      }

      .eyebrow {
        margin: 0 0 24px;
        color: #078f8b;
        font-size: 23px;
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 118px;
        line-height: 0.92;
        letter-spacing: -0.055em;
      }

      .copy {
        margin-top: 32px;
        color: #5e7074;
        font-size: 31px;
        line-height: 1.45;
      }

      .metric {
        display: inline-flex;
        align-items: center;
        height: 72px;
        margin-top: 42px;
        padding: 0 28px;
        border-radius: 999px;
        background: #102126;
        color: white;
        font-size: 34px;
        font-weight: 950;
      }

      .stage {
        position: absolute;
        right: 74px;
        top: 118px;
        width: 930px;
        height: 820px;
      }

      .storyboard {
        position: absolute;
        inset: 0;
        border-radius: 36px;
        background-image:
          linear-gradient(90deg, rgba(16, 33, 38, 0.68), rgba(16, 33, 38, 0.02)),
          url("../../assets/willcrafty-onboarding-storyboard.png");
        background-size: cover;
        background-position: center;
        opacity: 0.12;
      }

      .device,
      .document,
      .export-card,
      .person-card {
        position: absolute;
        border: 1px solid rgba(16, 33, 38, 0.08);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 40px 100px rgba(14, 48, 52, 0.16);
      }

      .device {
        left: 38px;
        bottom: 80px;
        width: 500px;
        height: 610px;
        padding: 44px;
      }

      .device::before {
        content: "";
        display: block;
        width: 112px;
        height: 112px;
        border-radius: 28px;
        background: var(--accent, #0abab5);
      }

      .line {
        display: block;
        height: 24px;
        margin-top: 28px;
        border-radius: 999px;
        background: #d6e7e5;
      }

      .line.dark {
        width: 84%;
        height: 34px;
        background: #102126;
      }

      .line.short {
        width: 56%;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 40px;
      }

      .cards span {
        height: 110px;
        border-radius: 18px;
        background: #f1fbfa;
      }

      .document {
        right: 0;
        top: 118px;
        width: 420px;
        height: 560px;
        padding: 48px;
      }

      .document strong {
        display: block;
        width: 72%;
        height: 34px;
        border-radius: 999px;
        background: #0abab5;
      }

      .document i {
        display: block;
        height: 18px;
        margin-top: 24px;
        border-radius: 999px;
        background: #d2e0df;
      }

      .person-card,
      .export-card {
        display: grid;
        place-items: center;
        width: 190px;
        height: 130px;
        color: #102126;
        font-size: 32px;
        font-weight: 950;
      }

      .person-card {
        top: 40px;
        left: 390px;
      }

      .person-card.two {
        top: 212px;
        left: 304px;
      }

      .person-card.three {
        top: 382px;
        left: 430px;
      }

      .export-card {
        right: 96px;
        bottom: 40px;
      }

      .export-card.two {
        right: 310px;
        bottom: 10px;
      }

      .export-card.three {
        right: 518px;
        bottom: 52px;
      }

      .progress {
        position: absolute;
        left: 90px;
        bottom: 94px;
        width: 620px;
        height: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(16, 33, 38, 0.12);
      }

      .progress span {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left;
        border-radius: inherit;
        background: #0abab5;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="willcrafty-onboarding" data-start="0" data-width="1920" data-height="1080">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="8" y="5" width="28" height="38" rx="8"></rect>
            <path d="M18 26.5 23 31.5 34 18.5"></path>
            <path d="M29 5v10h10"></path>
          </svg>
        </div>
        WillCrafty
      </div>

      <div class="headline">
        <p class="eyebrow" id="eyebrow">Step 1</p>
        <h1 id="title">Answer simple questions</h1>
        <p class="copy" id="copy">WillCrafty turns estate planning into calm, guided prompts for your identity, jurisdiction, and executor.</p>
        <div class="metric" id="metric">04 min</div>
      </div>

      <div class="stage">
        <div class="storyboard"></div>
        <div class="device">
          <span class="line dark"></span>
          <span class="line"></span>
          <span class="line short"></span>
          <div class="cards"><span></span><span></span><span></span></div>
        </div>
        <div class="document">
          <strong></strong>
          <i style="width: 94%"></i>
          <i style="width: 86%"></i>
          <i style="width: 62%"></i>
        </div>
        <div class="person-card">60%</div>
        <div class="person-card two">30%</div>
        <div class="person-card three">10%</div>
        <div class="export-card">PDF</div>
        <div class="export-card two">DOC</div>
        <div class="export-card three">TXT</div>
      </div>

      <div class="progress"><span></span></div>
    </div>

    <script>
      const scenes = [
        ["Step 1", "Answer simple questions", "WillCrafty turns estate planning into calm, guided prompts for your identity, jurisdiction, and executor.", "04 min", "#0ABAB5"],
        ["Step 2", "Name people who matter", "Add beneficiaries, guardians, and trusted contacts so your wishes are easy to understand later.", "100%", "#12A878"],
        ["Step 3", "Preview a clear will draft", "Watch the document assemble with executor details, asset distributions, personal wishes, and signing reminders.", "Ready", "#FF7A59"],
        ["Step 4", "Download privately", "Export PDF, Word, or plain text. No account required and no will data stored on WillCrafty servers.", "0 data", "#102126"],
      ];

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["willcrafty-onboarding"] = tl;

      scenes.forEach((scene, index) => {
        const at = index * 4;
        tl.call(() => {
          document.getElementById("eyebrow").textContent = scene[0];
          document.getElementById("title").textContent = scene[1];
          document.getElementById("copy").textContent = scene[2];
          document.getElementById("metric").textContent = scene[3];
          document.getElementById("root").style.setProperty("--accent", scene[4]);
        }, [], at);
        tl.fromTo(".headline > *", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.62, stagger: 0.08 }, at + 0.05);
        tl.fromTo(".device", { opacity: 0, y: 80, rotation: -5 }, { opacity: 1, y: 0, rotation: index % 2 ? 1.5 : -1.5, duration: 0.8 }, at + 0.18);
        tl.fromTo(".document", { opacity: 0, x: 90, rotation: 7 }, { opacity: 1, x: 0, rotation: index === 2 ? 0 : 3, duration: 0.8 }, at + 0.3);
        tl.fromTo(".person-card", { opacity: 0, scale: 0.72, y: 40 }, { opacity: index === 1 ? 1 : 0, scale: 1, y: 0, duration: 0.52, stagger: 0.08 }, at + 0.58);
        tl.fromTo(".export-card", { opacity: 0, scale: 0.72, y: -20 }, { opacity: index === 3 ? 1 : 0, scale: 1, y: 0, duration: 0.52, stagger: 0.08 }, at + 0.58);
      });

      tl.to(".progress span", { scaleX: 1, duration: 16, ease: "none" }, 0);
      tl.set({}, {}, 16);
    </script>
  </body>
</html>
